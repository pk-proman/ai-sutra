name: Deploy to Hostinger VPS

# Runs on every push to main, or manually from the Actions tab.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: hostinger-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install the browser used to pre-render pages
        run: npx playwright install --with-deps chromium

      - name: Check the content files are valid JSON
        run: |
          for f in public/content/*.json; do node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" || { echo "::error file=$f::$f is not valid JSON"; exit 1; }; done

      - name: Build the website
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: npm run build

      - name: Add server-only secrets (SMTP password, ERPNext keys)
        env:
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ERPNEXT_API_KEY: ${{ secrets.ERPNEXT_API_KEY }}
          ERPNEXT_API_SECRET: ${{ secrets.ERPNEXT_API_SECRET }}
        run: |
          if [ -n "$SMTP_PASSWORD$ERPNEXT_API_KEY$ERPNEXT_API_SECRET" ]; then
            node scripts/write-local-config.mjs dist/api/config.local.php
            echo "config.local.php written"
          else
            echo "No secrets set; skipping"
          fi

      - name: Upload to the Hostinger VPS over SSH
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SSH_PORT: ${{ vars.SSH_PORT || '22' }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/var/www/aisutra/public' }}
        run: |
          set -euo pipefail
          for v in SSH_HOST SSH_USER SSH_PRIVATE_KEY; do [ -n "${!v}" ] || { echo "::error::Missing secret $v (see README, VPS setup)"; exit 1; }; done
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          if [ -n "$SSH_KNOWN_HOSTS" ]; then printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts; else ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" > ~/.ssh/known_hosts 2>/dev/null; fi
          # --delete removes files that no longer exist in the build, but never deletes
          # the server-side secrets file. Enquiry backups live outside the web folder.
          rsync -az --delete --chmod=D755,F644 \
            --filter='P api/config.local.php' \
            -e "ssh -i ~/.ssh/deploy_key -p $SSH_PORT -o StrictHostKeyChecking=yes" \
            dist/ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/"
          echo "Deployed to $SSH_HOST:$DEPLOY_PATH"
